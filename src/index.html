            <option value="栃木県" class="p-form__option">栃木県</option>
          </select>
          <select class="p-form__select">
            <option value="月給17万~" class="p-form__option">月給17万~</option>
            <option value="月給18万~" class="p-form__option">月給18万~</option>

      <button type="submit" class="p-form__submit c-button">
