pre-commit:
  parallel: true
  commands:
    markuplint:
      glob: '**/*.{jsx}'
      run: npx markuplint "{staged_files}"
    eslint:
      glob: '**/*.{js,jsx}'
      run: npx eslint --fix --no-warn-ignored "{staged_files}"
      stage_fixed: true
    stylelint:
      glob: '**/*.{scss}'
      run: npx stylelint --fix "{staged_files}"
      stage_fixed: true
    prettier:
      glob: '**/*'
      exclude: '**/*.{svg}'
      run: npx prettier --ignore-path .prettierignore --write "{staged_files}"
      stage_fixed: true
